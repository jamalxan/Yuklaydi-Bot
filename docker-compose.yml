# Base stack (dev defaults). Production: add -f docker-compose.prod.yml.
#
# Secrets come from the environment / .env ONLY:
#   POSTGRES_PASSWORD  — used by postgres, pgbouncer and every DATABASE_URL
#   REDIS_PASSWORD     — optional; when set Redis requires it and the app
#                        injects it into REDIS_URL (see Settings.redis_dsn)

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-app: &app
  build: .
  env_file: .env
  logging: *default-logging
  restart: unless-stopped
  volumes:
    - downloads:/downloads
    - telegram_data:/var/lib/telegram-bot-api:ro
    # cookies.txt for Instagram/YouTube lives OUTSIDE /downloads (never swept)
    - ./secrets:/app/secrets:ro

x-app-env: &app-env
  LOCAL_API_URL: http://telegram-bot-api:8081
  # Route through PgBouncer for connection pooling
  DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD:-bot_password}@pgbouncer:5432/yuklaydi_bot
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  DOWNLOAD_DIR: /downloads

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - downloads:/downloads
      - telegram_data:/var/lib/telegram-bot-api
    # Only reachable from this host (and the compose network) — never public.
    ports:
      - "127.0.0.1:8081:8081"
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot_password}
      POSTGRES_DB: yuklaydi_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d yuklaydi_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer: transaction-mode pool — prevents worker replicas from
  # exhausting Postgres max_connections (default ~100).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: bot
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bot_password}
      DB_NAME: yuklaydi_bot
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      # Real check — the old "|| true" reported healthy even when down.
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # volatile-lru (NOT allkeys-lru): only keys WITH a TTL (caches) are ever
    # evicted. arq queue jobs have no TTL — allkeys-lru could silently drop
    # queued downloads under memory pressure. 2gb headroom fits ~500k queued
    # jobs plus the file_id cache. The password is optional (REDIS_PASSWORD).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c 'exec redis-server --save 60 1 --loglevel warning
      --maxmemory 2gb --maxmemory-policy volatile-lru
      $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    volumes:
      - redis_data:/data
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

  bot:
    <<: *app
    command: python -m bot.main
    environment:
      <<: *app-env
    depends_on:
      telegram-bot-api:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Download worker — handles arq:queue (video downloads, broadcast, cleanup cron)
  worker:
    <<: *app
    command: arq bot.worker.tasks.WorkerSettings
    environment:
      <<: *app-env
      # Jobs are mostly I/O-bound; the per-process yt-dlp semaphore
      # (YT_DLP_WORKER_CONCURRENCY) caps the CPU/network-heavy part.
      WORKER_CONCURRENCY: 20
      YT_DLP_WORKER_CONCURRENCY: 4
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scale horizontally for heavy load: docker compose up -d --scale worker=8
    deploy:
      replicas: 2

  # Recognition worker — separate lane for Shazam/voice recognition
  worker-recognition:
    <<: *app
    command: arq bot.worker.tasks.RecognitionWorkerSettings
    environment:
      <<: *app-env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1

  # Music worker — separate lane for music search downloads
  worker-music:
    <<: *app
    command: arq bot.worker.tasks.MusicWorkerSettings
    environment:
      <<: *app-env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1

volumes:
  downloads:
  postgres_data:
  redis_data:
  telegram_data:
